  #     POSTGRES_USER: saya
  #     POSTGRES_PASSWORD: saya_secret
  #     POSTGRES_DB: saya
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - saya-pgdata:/var/lib/postgresql/data
  #   networks:
  #     - saya-net

networks:
  saya-net:
    driver: bridge

